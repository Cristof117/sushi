<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Vista por fuera del rollo">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f1c"/>
      <stop offset="100%" style="stop-color:#1a1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#e07b39;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#e07b39;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="150" rx="160" ry="120" fill="url(#glow)"/>
  <!-- rollo visto de arriba / capa externa -->
  <ellipse cx="200" cy="155" rx="130" ry="95" fill="#f5ebe0" stroke="#e07b39" stroke-width="4"/>
  <ellipse cx="200" cy="155" rx="105" ry="78" fill="#fff8f0" opacity="0.9"/>
  <!-- toppings externos -->
  <circle cx="120" cy="120" r="14" fill="#3d9b6e"/>
  <circle cx="280" cy="130" r="12" fill="#e07b39"/>
  <circle cx="200" cy="95" r="16" fill="#c41e3a" opacity="0.85"/>
  <circle cx="160" cy="200" r="11" fill="#e8b86d"/>
  <circle cx="250" cy="190" r="13" fill="#7dd3a8"/>
  <ellipse cx="200" cy="155" rx="70" ry="50" fill="#d4654f" opacity="0.25"/>
  <text x="200" y="265" text-anchor="middle" fill="#f5a962" font-family="sans-serif" font-size="18" font-weight="bold">POR FUERA</text>
  <text x="200" y="288" text-anchor="middle" fill="#f5ebe0" font-family="sans-serif" font-size="12" opacity="0.7">Capa externa · toppings</text>
</svg>
